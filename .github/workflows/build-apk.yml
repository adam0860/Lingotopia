name: Build Android APK

# Builds an installable APK on GitHub's servers and attaches it to a Release.
# Run it from the Actions tab (Run workflow), or it runs on every push to main.
# On your phone: open the repository's Releases page and download app-release.apk.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show versions
        run: flutter --version

      # The repository holds the app code, assets and Android icon resources. The rest of the
      # Android project (Gradle files, manifest, Kotlin) is generated here, the same way
      # `flutter create` made it on your PC. Existing files are kept.
      - name: Generate the Android project around the app
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml
          flutter create --platforms=android --project-name lingotopia --org com.lingotopia .
          cp /tmp/pubspec.yaml pubspec.yaml
          git checkout -- lib test 2>/dev/null || true

      - name: Add the per-language launcher icons to the manifest
        run: python3 tools/icon/patch_android_manifest.py android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - name: Build the APK
        run: flutter build apk --release

      - name: Keep the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lingotopia-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish the APK as a Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Lingotopia APK build ${{ github.run_number }}
          body: Debug-signed release APK built from commit ${{ github.sha }}. Download app-release.apk on your phone and open it to install.
          files: build/app/outputs/flutter-apk/app-release.apk
